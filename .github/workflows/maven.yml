# Messenger Backend
# Este workflow construye y prueba la aplicación Java en cada
# push o pull request a las ramas main/develop.

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancelar ejecuciones en progreso para la misma rama
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    
    # Directorio de trabajo por defecto para todos los pasos
    defaults:
      run:
        working-directory: messenger

    env:
      # Seguridad JWT (Fallback para PRs externos/Dependabot)
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'QmFzZTY0RW5jb2RlZFNlY3JldEtleUZvclRlc3RpbmdQdXJwb3Nlc09ubHk=' }}
      
      # Google Cloud Services (Fallback para PRs externos/Dependabot)
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY || 'test-api-key' }}
      GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME || 'test-bucket' }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'test-project' }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/google-credentials.json

    steps:
      # Configuración inicial
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 🔐 Crear archivo de credenciales de Google
        run: |
          echo "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}" > $GOOGLE_APPLICATION_CREDENTIALS
        working-directory: ${{ github.workspace }}

      # Compilar y probar (usa H2 en memoria para tests)
      - name: 🔨 Compilar con Maven
        run: mvn -B compile -DskipTests

      - name: 🧪 Ejecutar tests
        run: mvn -B test

      - name: 📦 Empaquetar aplicación
        run: mvn -B package -DskipTests

      # Artefactos (opcional: subir JAR para inspección)
      - name: 📤 Subir artefacto JAR
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: messenger-backend-${{ github.sha }}
          path: messenger/target/*.jar
          retention-days: 7
