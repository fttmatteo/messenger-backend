name: Java CI with Maven

# Disparadores: El flujo se ejecuta automáticamente en 'push' o 'pull_request' a la rama 'main'
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    # Variables de entorno inyectadas de forma segura desde los "Secrets" de GitHub
    env:
      DB_HOST: '${{ secrets.DB_HOST }}'
      DB_PORT: '${{ secrets.DB_PORT }}'
      DB_USERNAME: '${{ secrets.DB_USERNAME }}'
      #DB_PASSWORD: '${{ secrets.DB_PASSWORD }}'
      JWT_SECRET: '${{ secrets.JWT_SECRET }}'
      REDIS_HOST: '${{ secrets.REDIS_HOST }}'
      REDIS_PORT: '${{ secrets.REDIS_PORT }}'
      #REDIS_PASSWORD: '${{ secrets.REDIS_PASSWORD }}'
      GOOGLE_MAPS_API_KEY: '${{ secrets.GOOGLE_MAPS_API_KEY }}'
      GCS_BUCKET_NAME: '${{ secrets.GCS_BUCKET_NAME }}'
      GCP_PROJECT_ID: '${{ secrets.GCP_PROJECT_ID }}'
      GOOGLE_APPLICATION_CREDENTIALS: '${{ github.workspace }}/google-credentials.json'

    steps:
    # 1. Hacer checkout del código fuente repository
    - uses: actions/checkout@v4
    
    # 2. Configurar el entorno Java (JDK 21) y habilitar caché para Maven
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    # 3. Crear archivo de credenciales de Google Cloud dinámicamente desde secret
    - name: Create Google Credentials File
      run: echo "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}" > $GOOGLE_APPLICATION_CREDENTIALS

    # 4. Construir y empaquetar el proyecto con Maven (usa el pom.xml en la carpeta messenger)
    - name: Build with Maven
      run: mvn -B package --file messenger/pom.xml
