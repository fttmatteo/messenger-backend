# Messenger Backend
# Este workflow construye y prueba la aplicación Java en cada
# push o pull request a las ramas main/develop.

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancelar ejecuciones en progreso para la misma rama
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: messenger

    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/google-credentials.json
      TZ: America/Bogota

    steps:
      # 1. Clonar el código fuente del repositorio
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      # 2. Instalar Java 17 (Temurin) y configurar caché de Maven
      - name: ☕ Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Generar archivo de credenciales de Google desde secretos
      - name: 🔐 Crear archivo de credenciales de Google
        run: |
          echo "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}" > $GOOGLE_APPLICATION_CREDENTIALS
        working-directory: ${{ github.workspace }}

      # 4. Compilar código fuente sin ejecutar pruebas (fail-fast)
      - name: 🔨 Compilar con Maven
        run: mvn -B compile -DskipTests

      # 5. Ejecutar suite de pruebas unitarias e integración (genera reporte JaCoCo)
      # Testcontainers arranca MySQL y Redis automáticamente (no requiere docker-compose)
      - name: 🧪 Ejecutar tests
        run: mvn -B test

      # 6. Subir reporte de cobertura de JaCoCo
      - name: 📊 Subir reporte de cobertura (JaCoCo)
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: messenger/target/site/jacoco/
          retention-days: 7

      # 7. Empaquetar el JAR ejecutable (skip tests para ahorrar tiempo)
      - name: 📦 Empaquetar aplicación
        run: mvn -B package -DskipTests

      # 8. Subir el artefacto compilado (solo en rama main)
      - name: 📤 Subir artefacto JAR
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: messenger-backend-${{ github.sha }}
          path: messenger/target/*.jar
          retention-days: 7
