name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      DB_HOST: '${{ secrets.DB_HOST }}'
      DB_PORT: '${{ secrets.DB_PORT }}' # Optional, defaults to 3306 if not set
      DB_USERNAME: '${{ secrets.DB_USERNAME }}'
      DB_PASSWORD: '${{ secrets.DB_PASSWORD }}'
      JWT_SECRET: '${{ secrets.JWT_SECRET }}'
      REDIS_HOST: '${{ secrets.REDIS_HOST }}'
      REDIS_PORT: '${{ secrets.REDIS_PORT }}'
      REDIS_PASSWORD: '${{ secrets.REDIS_PASSWORD }}'
      GOOGLE_MAPS_API_KEY: '${{ secrets.GOOGLE_MAPS_API_KEY }}'
      GCS_BUCKET_NAME: '${{ secrets.GCS_BUCKET_NAME }}'
      GCP_PROJECT_ID: '${{ secrets.GCP_PROJECT_ID }}'
      GOOGLE_APPLICATION_CREDENTIALS: '${{ github.workspace }}/google-credentials.json'

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Create Google Credentials File
      run: echo "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}" > $GOOGLE_APPLICATION_CREDENTIALS

    - name: Build with Maven
      run: mvn -B package --file messenger/pom.xml
