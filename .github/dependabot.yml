# Configuración de Dependabot
# Crea PRs automáticamente para actualizar dependencias.
# https://docs.github.com/en/code-security/dependabot

version: 2

updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "America/Bogota"
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5

  # Maven (dependencias de Java)
  - package-ecosystem: "maven"
    directory: "/messenger"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "America/Bogota"
    commit-message:
      prefix: "build(deps)"
    labels:
      - "dependencies"
      - "java"
    open-pull-requests-limit: 10
    # Agrupar actualizaciones menores y de parche
    groups:
      spring:
        patterns:
          - "org.springframework*"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "org.junit*"
          - "org.mockito*"
          - "org.assertj*"
      security:
        patterns:
          - "io.jsonwebtoken*"
          - "org.springframework.security*"