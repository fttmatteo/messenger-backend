# Configuración de Dependabot
# Crea PRs automáticamente para actualizar dependencias.
# https://docs.github.com/en/code-security/dependabot

version: 2

updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "America/Bogota" # Hora local del equipo
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
    groups:
      todas-las-dependencias:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Maven (dependencias de Java)
  - package-ecosystem: "maven"
    directory: "/messenger"
    target-branch: "develop"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "America/Bogota" # Sincronizado con CI de actions
    commit-message:
      prefix: "build(deps)"
    labels:
      - "dependencies"
      - "java"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.google.cloud:libraries-bom"
    # Agrupar actualizaciones menores y de parche
    groups:
      todas-las-dependencias:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"