# ORQUESTACIÓN DE SERVICIOS - LOCAL (Docker Compose)
# Perfil: local - Todo empaquetado, sin hot reload.
#
# Comandos útiles:
# - Iniciar: docker-compose -f docker-compose.local.yml up --build
# - Detener: docker-compose -f docker-compose.local.yml down
# - Ver logs: docker-compose -f docker-compose.local.yml logs -f

services:
  # FRONTEND: Interfaz Web React/Vite
  messenger-frontend:
    build:
      context: ../messenger-frontend
      dockerfile: Dockerfile
    container_name: messenger-frontend
    ports:
      - "80:80"
    depends_on:
      - messenger-backend
    networks:
      - messenger-network
    restart: unless-stopped

  # APP: Backend Spring Boot
  messenger-backend:
    build: .
    container_name: messenger-backend
    ports:
      - "8080:8080"
    environment:
      # Perfil local para que funcione sin APIs externas
      - SPRING_PROFILES_ACTIVE=local
      - DB_HOST=messenger-db
      - REDIS_HOST=messenger-redis
      # Secretos por defecto (no requieren .env manual)
      - JWT_SECRET=esta-es-una-clave-secreta-de-prueba-para-distribucion-local-min-32-chars
      - DB_NAME=messenger_dev
      - DB_PASSWORD=secret123
    depends_on:
      messenger-db:
        condition: service_healthy
      messenger-redis:
        condition: service_healthy
    networks:
      - messenger-network
    restart: unless-stopped
    healthcheck:
      test: "wget -q -O - http://localhost:8080/actuator/health | grep UP || exit 1"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # DATABASE: MySQL 8.0
  messenger-db:
    image: mysql:8.0
    container_name: messenger-db
    environment:
      - MYSQL_ROOT_PASSWORD=secret123
      - MYSQL_DATABASE=messenger_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - messenger-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10
    restart: unless-stopped

  # PHPMYADMIN: Interfaz web para MySQL
  # Acceder en: http://localhost:8081
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: messenger-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: messenger-db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: secret123
    depends_on:
      - messenger-db
    networks:
      - messenger-network
    restart: unless-stopped

  # CACHE: Redis
  messenger-redis:
    image: redis:7-alpine
    container_name: messenger-redis
    ports:
      - "6379:6379"
    networks:
      - messenger-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# VOLÚMENES Y REDES
volumes:
  mysql_data:


networks:
  messenger-network:
    driver: bridge
