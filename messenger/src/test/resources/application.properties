# H2 Database configuration for Testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Create schema on start and drop on exit
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable deferred initialization for tests
spring.jpa.defer-datasource-initialization=false

# Redis Configuration (Mock/Fail fast)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=100

# Application Properties (Copied/Mocked from main)
spring.application.name=messenger

# JWT (Test-only - NO usar en producción)
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLW9ubHktbm90LWZvci1wcm9kdWN0aW9u
jwt.expiration=1800000

# File Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Google Cloud (Mock paths, beans might fail if they try to read on startup)
google.cloud.credentials.path=config/google-vision-credentials.json

# Google Maps
google.maps.config.path=config/google-maps-config.properties

# Google Cloud Storage Configuration (Tests)
google.cloud.storage.bucket-name=messenger-photos-fttmatteo
google.cloud.storage.credentials-path=config/messenger-storage.json
google.cloud.storage.project-id=messenger-storage-481216
google.cloud.storage.signed-url-expiration-hours=24

# Tracking
tracking.update.interval=30000
tracking.max.distance.validation=200
tracking.history.retention.days=30

# WebSocket
websocket.allowed.origins=http://localhost:3000,http://localhost:5173,http://localhost:4200
