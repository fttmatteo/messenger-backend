# Configuración para ejecución de tests automatizados
# Iniciar servicios: docker compose -f messenger/src/test/resources/compose.yml up -d
spring.docker.compose.enabled=false

# Configuración de Base de Datos - Docker Compose con puertos fijos
spring.datasource.url=jdbc:mysql://localhost:3307/messenger_db_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=test
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Timezone - Forzar America/Bogota para tests consistentes
spring.jackson.time-zone=America/Bogota
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# DDL: validate ya que usamos Flyway para el esquema en tests
spring.jpa.hibernate.ddl-auto=validate

# debug
spring.jpa.show-sql=false

# JWT - Clave de Test (Base64)
jwt.secret=QmFzZTY0RW5jb2RlZFNlY3JldEtleUZvclRlc3RpbmdQdXJwb3Nlc09ubHk=
jwt.expiration=3600000 

# Cookies - Sin HTTPS en tests
app.cookie.secure=false 

# Servicios Externos - Mock
app.storage.type=local
app.storage.path=./test-uploads
app.ocr.mode=mock

# Google Cloud - Valores Dummy
google.maps.api-key=test-api-key
google.cloud.storage.bucket-name=test-bucket
google.cloud.storage.project-id=test-project
google.cloud.storage.signed-url-expiration-hours=24

# Redis - Docker Compose con puerto fijo 6380
redis.enabled=true
spring.data.redis.host=localhost
spring.data.redis.port=6380
spring.data.redis.timeout=60000ms
spring.data.redis.lettuce.pool.max-active=1
spring.data.redis.lettuce.pool.max-idle=0
spring.data.redis.lettuce.shutdown-timeout=0ms

# Tracking - Test values
tracking.update.interval=30000
tracking.max.distance.validation=200
tracking.history.retention.days=30

# WebSocket - CORS
websocket.allowed.origins=http://localhost:3000
cors.allowed-origins=http://localhost:3000

# Logging - Optimizado para tests rápidos
logging.level.root=WARN
logging.level.app=INFO
logging.level.org.hibernate.SQL=WARN

# Optimizaciones de Arranque
spring.main.banner-mode=off
spring.main.allow-bean-definition-overriding=true
spring.jmx.enabled=false
spring.jpa.defer-datasource-initialization=false

# Flyway - Habilitado para tests (Validar compatibilidad de scripts reales)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=true
