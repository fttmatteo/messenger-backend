# ============================================
# PERFIL: prod
# ============================================

# Graceful Shutdown - Cierre elegante
# Permite que las conexiones activas terminen antes de cerrar
server.shutdown=graceful

# Tiempo máximo de espera para cerrar (30 segundos)
spring.lifecycle.timeout-per-shutdown-phase=30s

# Puerto - Cloud Run
# Cloud Run inyecta la variable PORT, Spring Boot debe escuchar en ese puerto
server.port=${PORT:8080}

# Base de Datos - Cloud SQL MySQL Producción
# Conexión vía Unix Socket (más segura y rápida desde Cloud Run)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql:///${DB_NAME}?cloudSqlInstance=${CLOUD_SQL_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.mysql.SocketFactory&serverTimezone=America/Bogota
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Cloud SQL - Configuración adicional
# Connection name formato: project-id:region:instance-id
spring.cloud.gcp.sql.instance-connection-name=${CLOUD_SQL_CONNECTION_NAME}
spring.cloud.gcp.sql.database-name=${DB_NAME}

# JPA/Hibernate - Gestión del esquema
# Flyway maneja TODO el esquema, Hibernate no interfiere
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# Hibernate L2 Cache - Usa Redis para cachear entidades
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.use_query_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=app.infrastructure.config.SpringRedissonRegionFactory
# Configuración de Redis para Hibernate (usa las mismas variables que Spring Data Redis)
spring.jpa.properties.hibernate.cache.redisson.host=${REDIS_HOST}
spring.jpa.properties.hibernate.cache.redisson.port=${REDIS_PORT}
spring.jpa.properties.hibernate.cache.redisson.password=${REDIS_PASSWORD:}
# Caché solo para entidades marcadas con @Cache
spring.jpa.properties.jakarta.persistence.sharedCache.mode=ENABLE_SELECTIVE

# SQL NUNCA visible en producción
spring.jpa.show-sql=false

# Pool de conexiones optimizado para Cloud SQL y db-f1-micro
# Configuración profesional para evitar latencias y detectar fugas (leaks)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=MessengerHikariPool
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1
# Character encoding UTF-8 para MySQL
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci

# Optimización MySQL via JDBC / Hikari
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true

# JWT - 30 minutos para producción (más corto por seguridad)
jwt.expiration=1800000

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# Pool de conexiones Redis optimizado para Cloud Run
# Reducido porque Cloud Run escala horizontalmente (múltiples instancias)
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=4
spring.data.redis.lettuce.pool.min-idle=1

# WebSocket - CORS
websocket.allowed.origins=${WEBSOCKET_ALLOWED_ORIGINS}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Google Cloud Storage
app.storage.type=gcs

# OCR - Modos disponibles: plate-recognizer, mock
# Plate Recognizer es especializado en placas (recomendado para Colombia)
app.ocr.mode=plate-recognizer

# Plate Recognizer - API especializada en placas vehiculares
# Obtener token en: https://platerecognizer.com/
app.plate-recognizer.token=${PLATE_RECOGNIZER_TOKEN}
app.plate-recognizer.region=co

# Logging - Mínimo para rendimiento
logging.level.root=WARN
logging.level.app=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework=WARN
logging.level.org.springframework.security=WARN

# Flyway - Gestión de migraciones obligatoria en producción
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=true

# Solo errores para frameworks ruidosos
logging.level.com.zaxxer.hikari=WARN
logging.level.io.lettuce=WARN

# Actuator - Solo health para load balancer
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Seguridad Adicional
# Headers de seguridad
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=none

# Cookies de Autenticación - Secure en producción
app.cookie.secure=true

# Comprimir respuestas
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024

# Cache Control
spring.web.resources.cache.cachecontrol.max-age=31536000

# Errores - No exponer stack traces
# Actualizado para Spring Boot 2.6+ / 3.x
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never
spring.web.error.include-exception=false

# HTTPS - Cloud Run Reverse Proxy Configuration
# Cloud Run maneja HTTPS externamente y redirige a la app vía HTTP interno
# Esta configuración permite que Spring Boot detecte la petición original HTTPS
# leyendo los headers X-Forwarded-* que Cloud Run envía
server.forward-headers-strategy=framework

# HTTP/2 - Habilitado para mejor rendimiento
server.http2.enabled=true
