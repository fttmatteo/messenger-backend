# ============================================
# PERFIL: PROD (Producción)
# ============================================
# Configuración optimizada para producción
# Logs mínimos, seguridad máxima, rendimiento optimizado
#
# IMPORTANTE: Todas las variables sensibles DEBEN venir de
# variables de entorno, NUNCA valores hardcoded.
#
# Activar: SPRING_PROFILES_ACTIVE=prod
#
# ============================================
# Graceful Shutdown - Cierre elegante
# ============================================
# Permite que las conexiones activas terminen antes de cerrar
server.shutdown=graceful
# Tiempo máximo de espera para cerrar (30 segundos)
spring.lifecycle.timeout-per-shutdown-phase=30s

# ============================================
# Base de Datos - MySQL Producción
# ============================================
# OBLIGATORIO: Configurar via variables de entorno
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true&allowPublicKeyRetrieval=false&serverTimezone=America/Bogota
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# DDL: validate - Solo valida esquema, NO modifica nada
# Las migraciones deben hacerse con Flyway
spring.jpa.hibernate.ddl-auto=validate

# SQL NUNCA visible en producción
spring.jpa.show-sql=false

# Pool de conexiones optimizado
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ============================================
# JWT - Producción (más corto por seguridad)
# ============================================
# 30 minutos para producción
jwt.expiration=1800000

# ============================================
# Redis - Producción
# ============================================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# Pool de conexiones Redis
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# ============================================
# WebSocket - Orígenes de Producción
# ============================================
# IMPORTANTE: Cambiar a dominios reales de producción
websocket.allowed.origins=${WEBSOCKET_ALLOWED_ORIGINS:https://app.tudominio.com}

# ============================================
# Google Cloud Storage - Producción
# ============================================
app.storage.type=gcs

# ============================================
# OCR - Google Vision
# ============================================
app.ocr.mode=google-vision

# ============================================
# Tracking - Producción
# ============================================
tracking.update.interval=30000
# Mayor distancia en producción para evitar falsos negativos
tracking.max.distance.validation=300

# ============================================
# Logging - Mínimo para rendimiento
# ============================================
logging.level.root=WARN
logging.level.app=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework=WARN
logging.level.org.springframework.security=WARN

# Solo errores para frameworks ruidosos
logging.level.com.zaxxer.hikari=WARN
logging.level.io.lettuce=WARN

# ============================================
# Actuator - Solo health para load balancer
# ============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# ============================================
# Seguridad Adicional - Producción
# ============================================
# Headers de seguridad
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Comprimir respuestas
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024

# Cache Control
spring.web.resources.cache.cachecontrol.max-age=31536000

# ============================================
# Errores - No exponer stack traces
# ============================================
# Actualizado para Spring Boot 2.6+ / 3.x
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never
spring.web.error.include-exception=false
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://messenger-app.com}

# ============================================
# HTTPS - Configuración de certificado SSL
# ============================================
# OPCIÓN 1: SSL directo en Spring Boot (recomendado para desarrollo/staging)
# Descomenta estas líneas cuando tengas un certificado SSL
# server.ssl.enabled=true
# server.ssl.key-store=${SSL_KEYSTORE_PATH}
# server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=messenger

# OPCIÓN 2: Detrás de reverse proxy (Nginx/Traefik) - RECOMENDADO PRODUCCIÓN
# El proxy maneja SSL y redirige a HTTP interno
# En este caso, habilita el header forwarded:
server.forward-headers-strategy=framework

# Forzar HTTPS vía header X-Forwarded-Proto
# (Requiere reverse proxy configurado correctamente)
server.tomcat.redirect-context-root=true

# ============================================
# Headers de Seguridad HTTP
# ============================================
# HSTS (Strict Transport Security) - 1 año
# Fuerza navegadores a usar HTTPS
server.http2.enabled=true
