# ============================================
# PERFIL: prod
# ============================================
# Configuración optimizada para producción
# Logs mínimos, seguridad máxima, rendimiento optimizado
#
# IMPORTANTE: Todas las variables sensibles DEBEN venir de
# variables de entorno, NUNCA valores hardcoded.

# Graceful Shutdown - Cierre elegante
# Permite que las conexiones activas terminen antes de cerrar
server.shutdown=graceful

# Tiempo máximo de espera para cerrar (30 segundos)
spring.lifecycle.timeout-per-shutdown-phase=30s

# Puerto - Cloud Run
# Cloud Run inyecta la variable PORT, Spring Boot debe escuchar en ese puerto
server.port=${PORT:8080}

# Base de Datos - MySQL Producción
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# DDL: validate - Flyway gestiona migraciones, Hibernate solo valida
spring.jpa.hibernate.ddl-auto=update

# SQL NUNCA visible en producción
spring.jpa.show-sql=false

# Pool de conexiones optimizado
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JWT - 30 minutos para producción (más corto por seguridad)
jwt.expiration=1800000

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# Pool de conexiones Redis
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# WebSocket - CORS
websocket.allowed.origins=${WEBSOCKET_ALLOWED_ORIGINS}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Google Cloud Storage
app.storage.type=gcs

# OCR - Google Vision
app.ocr.mode=google-vision

# Logging - Mínimo para rendimiento
logging.level.root=WARN
logging.level.app=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework=WARN
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=DEBUG

# Solo errores para frameworks ruidosos
logging.level.com.zaxxer.hikari=WARN
logging.level.io.lettuce=WARN

# Actuator - Solo health para load balancer
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Seguridad Adicional
# Headers de seguridad
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Comprimir respuestas
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024

# Cache Control
spring.web.resources.cache.cachecontrol.max-age=31536000

# Errores - No exponer stack traces
# Actualizado para Spring Boot 2.6+ / 3.x
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never
spring.web.error.include-exception=false

# HTTPS - Configuración de certificado SSL
# Detrás de reverse proxy (Nginx/Traefik)
# El proxy maneja SSL y redirige a HTTP interno
# En este caso, habilita el header forwarded:
server.forward-headers-strategy=framework

# Forzar HTTPS vía header X-Forwarded-Proto
# (Requiere reverse proxy configurado correctamente)
server.tomcat.redirect-context-root=true

# Headers de Seguridad HTTP
# HSTS (Strict Transport Security) - 1 año
# Fuerza navegadores a usar HTTPS
server.http2.enabled=true
