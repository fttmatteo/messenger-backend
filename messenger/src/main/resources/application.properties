# ============================================
# PLAK BACKEND - Configuración Base
# ============================================

# Nombre de la aplicación (usado en logs y métricas)
spring.application.name=plak

# Base de Datos - Configuración Común
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Uploads - Límites de Archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Encoding UTF-8 - Asegura caracteres especiales (ñ, á, etc.)
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force-response=true

# JSON - Configuración de Jackson
spring.jackson.time-zone=America/Bogota
spring.jackson.default-property-inclusion=non_null
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSXXX

# JWT - Autenticación
jwt.secret=${JWT_SECRET}
app.cookie.secure=true

# Google Cloud - Configuración Base
google.maps.api-key=${GOOGLE_MAPS_API_KEY}
google.cloud.storage.bucket-name=${GCS_BUCKET_NAME}
google.cloud.storage.project-id=${GCP_PROJECT_ID}
google.cloud.storage.signed-url-expiration-hours=24

# Configuración del sistema de tracking
# Intervalo optimizado: 45s (reduce carga del servidor ~33% vs 30s)
tracking.update.interval=45000
# Distancia máxima permitida en metros entre actualizaciones para validación
tracking.max.distance.validation=200
# Días de retención del historial de tracking
tracking.history.retention.days=30

# Redis - Configuración Base
spring.data.redis.timeout=60000

# Cache - Configuración Base (Redis como proveedor)
spring.cache.type=redis
spring.cache.redis.cache-null-values=false

# Actuator - Seguridad (solo health e info habilitados por defecto)
# Spring Boot 3.x usa exposure.include para controlar endpoints
management.endpoints.web.exposure.include=health,info

# Días en papelera antes de borrado permanente (default: 60)
app.trash.retention-days=60

# Cron para limpieza de papelera (default: 3AM diario)
app.trash.cleanup-cron=0 0 3 * * ?

# Cloudflare Turnstile - Verificación anti-bot
turnstile.secret-key=${TURNSTILE_SECRET_KEY}