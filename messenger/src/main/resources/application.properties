# ============================================
# MESSENGER BACKEND - Configuración Base
# ============================================
# Este archivo contiene configuración común a TODOS los perfiles.
# Las propiedades específicas se definen en application-{profile}.properties
#
# Perfiles disponibles:
#   - local: Desarrollo local sin servicios externos
#   - dev: Desarrollo con servicios externos (Google APIs)
#   - prod: Producción optimizada
#
# Para activar un perfil:
#   1. Variable de entorno: SPRING_PROFILES_ACTIVE=dev
#   2. Línea de comandos: --spring.profiles.active=dev
#   3. application.properties: spring.profiles.active=dev (no recomendado)
# ============================================

spring.application.name=messenger

# ============================================
# Base de Datos - Configuración Común
# ============================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# ============================================
# Uploads - Límites de Archivos
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# JWT - Autenticación
# ============================================
jwt.secret=${JWT_SECRET}

# ============================================
# Google Cloud - Configuración Base
# ============================================
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
google.cloud.storage.bucket-name=${GCS_BUCKET_NAME:messenger-backend-photos}
google.cloud.storage.project-id=${GCP_PROJECT_ID:messenger-backend-480704}
google.cloud.storage.signed-url-expiration-hours=24

# ============================================
# Tracking - Configuración Base
# ============================================
tracking.update.interval=30000
tracking.max.distance.validation=200
tracking.history.retention.days=30

# ============================================
# Redis - Configuración Base
# ============================================
spring.data.redis.timeout=60000