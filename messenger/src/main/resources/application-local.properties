# ============================================
# PERFIL: LOCAL
# ============================================
# Desarrollo local SIN servicios externos (Google APIs)
# Usa mock/stub para servicios que requieren APIs externas
# Ideal para desarrollo offline o sin credenciales configuradas
#
# Activar: SPRING_PROFILES_ACTIVE=local
#
# ============================================
# Base de Datos - MySQL Local
# ============================================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# DDL: update para preservar datos entre reinicios
# Nota: Flyway está habilitado pero no se ejecuta automáticamente en Spring Boot 4.0
# Si necesitas migraciones, ejecuta scripts SQL manualmente
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL para debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# JWT - Desarrollo (token más largo)
# ============================================
# 8 horas para desarrollo sin relogin frecuente
jwt.expiration=28800000

# ============================================
# Redis Local
# ============================================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# ============================================
# WebSocket - Orígenes de Desarrollo
# ============================================
websocket.allowed.origins=${WEBSOCKET_ALLOWED_ORIGINS:localhost:3000,http://localhost:5173,http://localhost:4200,http://127.0.0.1:3000}

# ============================================
# Almacenamiento Local (sin GCS)
# ============================================
app.storage.type=local
app.storage.path=./uploads

# ============================================
# OCR Local (sin Google Vision)
# ============================================
# Modo mock: acepta cualquier placa sin validar
app.ocr.mode=mock

# ============================================
# Logging - Máximo detalle para debug
# ============================================
logging.level.app=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG
