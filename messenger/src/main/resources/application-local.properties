# ============================================
# PERFIL: local
# ============================================
# Desarrollo local SIN servicios externos - Google APIs
# Usa mock/stub para servicios que requieren APIs externas

# Base de Datos - MySQL Local (Valores por defecto para Docker/Local)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:messenger_dev}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:secret123}

# Nota: Flyway habilitado para manejar las migraciones de base de datos.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL para debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT - 8 horas para desarrollo (Secreto por defecto para perfil local)
jwt.secret=${JWT_SECRET:esta-es-una-clave-secreta-de-prueba-para-distribucion-local-min-32-chars}
jwt.expiration=28800000 

# Redis local
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Hibernate L2 Cache - Usa Redis para cachear entidades
# Pool de conexiones (local)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.pool-name=MessengerHikariLocalPool

spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.use_query_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=app.infrastructure.config.SpringRedissonRegionFactory
spring.jpa.properties.hibernate.cache.redisson.host=${REDIS_HOST:localhost}
spring.jpa.properties.hibernate.cache.redisson.port=${REDIS_PORT:6379}
spring.jpa.properties.hibernate.cache.redisson.password=${REDIS_PASSWORD:}
spring.jpa.properties.jakarta.persistence.sharedCache.mode=ENABLE_SELECTIVE

# WebSocket (reemplazar por el origen de la app)
websocket.allowed.origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost,http://localhost:5173,http://localhost:80,capacitor://localhost}

# Seguridad - CORS Allowed Origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:5173,http://localhost:80,capacitor://localhost}

# Cloudflare Turnstile - Clave de prueba (siempre retorna true)
turnstile.secret-key=${TURNSTILE_SECRET_KEY:1x00000000000000000000000000000000AA}

# Google Cloud Mock Defaults (para zero-config local)
google.maps.api-key=${GOOGLE_MAPS_API_KEY:mock-key}
google.cloud.storage.bucket-name=${GCS_BUCKET_NAME:mock-bucket}
google.cloud.storage.project-id=${GCP_PROJECT_ID:mock-project}

# WhatsApp Mock Defaults
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:mock-id}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:mock-token}
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:mock-verify}
whatsapp.app-secret=${WHATSAPP_APP_SECRET:mock-secret}

# Almacenamiento local (sin GCS)
app.storage.type=local
app.storage.path=./uploads

# OCR local (sin API externa)
# Modo mock: acepta cualquier placa sin validar
app.ocr.mode=mock

# Logging
logging.level.app=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG
