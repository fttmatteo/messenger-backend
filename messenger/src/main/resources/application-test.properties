# ============================================
# PERFIL: test
# ============================================
# Configuración para ejecución de tests automatizados
# Base de datos H2 en memoria para tests rápidos sin dependencias externas

# Base de Datos - H2 en Memoria
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# DDL: create-drop para reiniciar esquema en cada test
spring.jpa.hibernate.ddl-auto=create-drop

# debug
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# JWT - Clave de Test 
jwt.secret=test-secret-key-for-testing-purposes-minimum-256-bits-required-here
jwt.expiration=3600000 

# Servicios Externos - Mock
app.storage.type=local
app.storage.path=./test-uploads
app.ocr.mode=mock

# Google Cloud - Valores Dummy
google.maps.api-key=test-api-key
google.cloud.storage.bucket-name=test-bucket
google.cloud.storage.project-id=test-project
google.cloud.storage.signed-url-expiration-hours=24

# Redis - Mock/Deshabilitado
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=100

# Tracking - Test values
tracking.update.interval=30000
tracking.max.distance.validation=200
tracking.history.retention.days=30

# Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# WebSocket
websocket.allowed.origins=http://localhost:3000

# CORS - Orígenes permitidos para tests
cors.allowed-origins=http://localhost:3000

# Logging - Optimizado para tests rápidos
logging.level.root=WARN
logging.level.app=INFO
logging.level.org.hibernate.SQL=WARN

# Optimizaciones de Arranque
spring.main.banner-mode=off
spring.jmx.enabled=false
spring.jpa.defer-datasource-initialization=false
