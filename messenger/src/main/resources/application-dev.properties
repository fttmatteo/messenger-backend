# ============================================
# PERFIL: DEV (Desarrollo)
# ============================================
# Desarrollo con servicios externos habilitados (Google APIs)
# Conecta a base de datos de desarrollo
# Logs detallados para debugging
#
# Activar: SPRING_PROFILES_ACTIVE=dev
#
# ============================================
# Base de Datos - MySQL Desarrollo
# ============================================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# DDL: update para preservar datos entre reinicios
spring.jpa.hibernate.ddl-auto=update

# SQL visible para debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# JWT - Desarrollo
# ============================================
# 2 horas para desarrollo
jwt.expiration=7200000

# ============================================
# Redis - Desarrollo
# ============================================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# ============================================
# WebSocket - Orígenes de Desarrollo
# ============================================
websocket.allowed.origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200,http://127.0.0.1:3000}

# ============================================
# Google Cloud Storage - Desarrollo
# ============================================
app.storage.type=gcs

# ============================================
# OCR - Google Vision (requiere credenciales)
# ============================================
app.ocr.mode=google-vision

# ============================================
# Tracking - Desarrollo
# ============================================
# Intervalo más corto para testing
tracking.update.interval=15000

# ============================================
# Logging - Detallado para desarrollo
# ============================================
logging.level.app=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# ============================================
# Actuator - Endpoints de desarrollo
# ============================================
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always
