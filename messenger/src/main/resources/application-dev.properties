# ============================================
# PERFIL: dev
# ============================================
# Desarrollo con servicios externos habilitados - Google APIs
# Logs para debugging

# Base de Datos - MySQL Desarrollo
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# DDL en none para dejar que Flyway gestione el esquema
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Carga automática de datos de desarrollo
spring.sql.init.mode=never

# SQL visible para debugging
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT - 8 horas para desarrollo
jwt.expiration=28800000 

# Cookies - Sin HTTPS en desarrollo local
app.cookie.secure=false 

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# WebSocket - CORS
websocket.allowed.origins=http://localhost:5173,http://localhost,capacitor://localhost
cors.allowed-origins=http://localhost:5173,http://localhost,capacitor://localhost

# Google Cloud Storage
app.storage.type=gcs

# OCR - Modos: plate-recognizer, mock
app.ocr.mode=plate-recognizer
app.plate-recognizer.token=${PLATE_RECOGNIZER_TOKEN}
app.plate-recognizer.region=co

# Tracking
tracking.update.interval=15000

# Logging
logging.level.app=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Actuator
# Estado general: http://localhost:8080/actuator/health
# Métricas: http://localhost:8080/actuator/metrics
# Variables de entorno: http://localhost:8080/actuator/env (Solo visible en perfil dev por seguridad)
# Lista de todos los endpoints: http://localhost:8080/actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
