# ============================================
# PERFIL: dev
# ============================================
# Desarrollo con servicios externos habilitados - Google APIs
# Logs para debugging

# Base de Datos - MySQL Desarrollo
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# DDL update para preservar datos entre reinicios
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

# Carga automática de datos de desarrollo
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/data-dev.sql
spring.jpa.defer-datasource-initialization=true

# SQL visible para debugging
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT - 8 horas para desarrollo
jwt.expiration=28800000 

# Cookies - Sin HTTPS en desarrollo local
app.cookie.secure=false 

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# WebSocket - CORS
websocket.allowed.origins=http://localhost:5173
cors.allowed-origins=http://localhost:5173

# Google Cloud Storage
app.storage.type=gcs

# OCR - Google Vision
app.ocr.mode=google-vision

# Tracking
tracking.update.interval=15000

# Logging
logging.level.app=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Actuator
# Estado general: http://localhost:8080/actuator/health
# Métricas: http://localhost:8080/actuator/metrics
# Variables de entorno: http://localhost:8080/actuator/env (Solo visible en perfil dev por seguridad)
# Lista de todos los endpoints: http://localhost:8080/actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
