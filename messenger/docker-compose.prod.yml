# ============================================
# DOCKER COMPOSE - PRODUCCIÓN
# ============================================
# Este archivo orquesta todos los servicios necesarios para producción:
# - Nginx (reverse proxy + SSL)
# - Spring Boot Application
# - MySQL Database
# - Redis (cache + tracking)
# - Certbot (renovación de certificados SSL)
#
# Uso:
#   1. Configurar variables en .env
#   2. Ejecutar: docker compose -f docker-compose.prod.yml up -d
#   3. Obtener certificados SSL: docker compose -f docker-compose.prod.yml run certbot
# ============================================

services:
  # ============================================
  # REVERSE PROXY: Nginx
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: messenger-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-messenger.example.com}
    depends_on:
      messenger-backend:
        condition: service_healthy
    networks:
      - messenger-network
    healthcheck:
      test: [ "CMD", "nginx", "-t" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # APLICACIÓN: Spring Boot
  # ============================================
  messenger-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: messenger-backend
    restart: unless-stopped
    # Puerto NO expuesto externamente (solo accesible via Nginx)
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=messenger-db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=messenger-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/google-credentials.json
      - WEBSOCKET_ALLOWED_ORIGINS=${WEBSOCKET_ALLOWED_ORIGINS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    volumes:
      # Credenciales de Google Cloud (montar archivo JSON)
      - ${GOOGLE_CREDENTIALS_FILE:-./google-credentials.json}:/app/google-credentials.json:ro
    depends_on:
      messenger-db:
        condition: service_healthy
      messenger-redis:
        condition: service_healthy
    networks:
      - messenger-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============================================
  # BASE DE DATOS: MySQL
  # ============================================
  messenger-db:
    image: mysql:8.0
    container_name: messenger-db
    restart: unless-stopped
    # Puerto NO expuesto externamente por seguridad
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      # Script de inicialización opcional
      - ./init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - messenger-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    command: --default-authentication-plugin=mysql_native_password

  # ============================================
  # CACHE: Redis
  # ============================================
  messenger-redis:
    image: redis:alpine
    container_name: messenger-redis
    restart: unless-stopped
    # Puerto NO expuesto externamente por seguridad
    expose:
      - "6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - messenger-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # SSL: Certbot (Let's Encrypt)
  # ============================================
  certbot:
    image: certbot/certbot
    container_name: messenger-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Comando para obtener certificados (ejecutar manualmente la primera vez)
    # docker compose -f docker-compose.prod.yml run certbot certonly --webroot -w /var/www/certbot -d tu-dominio.com
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

# ============================================
# VOLÚMENES PERSISTENTES
# ============================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

# ============================================
# REDES
# ============================================
networks:
  messenger-network:
    driver: bridge
