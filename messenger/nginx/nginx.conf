# ============================================
# NGINX Reverse Proxy para Messenger Backend
# ============================================
# Esta configuración:
# - Termina SSL/TLS con Let's Encrypt
# - Proxy reverso a Spring Boot (puerto 8080)
# - Headers de seguridad OWASP recomendados
# - Compresión gzip
# - Rate limiting a nivel de proxy
# ============================================

events {
    worker_connections 1024;
}

http {
    # ============================================
    # Configuración General
    # ============================================
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # ============================================
    # Compresión Gzip
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/xml+rss text/javascript application/x-javascript;

    # ============================================
    # Rate Limiting (capa adicional a Bucket4j)
    # ============================================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;

    # ============================================
    # Upstream - Spring Boot Application
    # ============================================
    upstream messenger_backend {
        server messenger-backend:8080;
        keepalive 32;
    }

    # ============================================
    # Servidor HTTP (Redirección a HTTPS)
    # ============================================
    server {
        listen 80;
        server_name ${DOMAIN_NAME};
        
        # Redirect all HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }

    # ============================================
    # Servidor HTTPS (Principal)
    # ============================================
    server {
        listen 443 ssl http2;
        server_name ${DOMAIN_NAME};

        # ============================================
        # SSL/TLS Configuration
        # ============================================
        ssl_certificate /etc/letsencrypt/live/${DOMAIN_NAME}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${DOMAIN_NAME}/privkey.pem;
        
        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_stapling on;
        ssl_stapling_verify on;

        # ============================================
        # Security Headers (OWASP)
        # ============================================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' wss://$host" always;

        # ============================================
        # API Routes
        # ============================================
        
        # Auth endpoints (rate limited más estricto)
        location /auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://messenger_backend;
            include /etc/nginx/proxy_params;
        }

        # WebSocket endpoint
        location /ws/ {
            proxy_pass http://messenger_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # Health check (sin rate limit para load balancer)
        location /actuator/health {
            proxy_pass http://messenger_backend;
            include /etc/nginx/proxy_params;
        }

        # API general (rate limited)
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://messenger_backend;
            include /etc/nginx/proxy_params;
        }
    }
}
