# ORQUESTACIÓN DE SERVICIOS (Docker Compose)
# Define la infraestructura local necesaria para correr la aplicación completa.
#
# Comandos útiles:
# - Iniciar: docker-compose up --build
# - Detener: docker-compose down
# - Ver logs: docker-compose logs -f

services:
  # APP: Backend Spring Boot
  messenger-backend:
    build: .
    container_name: messenger-backend
    ports:
      - "8080:8080"
    # Cargar variables desde el archivo .env
    env_file:
      - ./.env
    environment:
      # Sobreescribir hosts para conectar a servicios de Docker
      - DB_HOST=messenger-db
      - REDIS_HOST=messenger-redis
      # Credenciales de Google Cloud dentro del contenedor
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json
    volumes:
      # Montar credenciales de Google Cloud (ruta definida en .env)
      - "${GOOGLE_APPLICATION_CREDENTIALS}:/app/credentials.json:ro"
    depends_on:
      messenger-db:
        condition: service_healthy
      messenger-redis:
        condition: service_healthy
    networks:
      - messenger-network
    restart: unless-stopped
    healthcheck:
      test: "curl --fail --silent http://localhost:8080/actuator/health | grep UP || exit 1"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # DATABASE: MySQL 8.0
  messenger-db:
    image: mysql:8.0
    container_name: messenger-db
    env_file:
      - ./.env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - messenger-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10
    restart: unless-stopped

  # PHPMYADMIN: Interfaz web para MySQL
  # Acceder en: http://localhost:8081
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: messenger-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: messenger-db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - messenger-db
    networks:
      - messenger-network
    restart: unless-stopped

  # CACHE: Redis
  messenger-redis:
    image: redis:alpine
    container_name: messenger-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    env_file:
      - ./.env
    networks:
      - messenger-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# VOLÚMENES Y REDES
volumes:
  mysql_data:


networks:
  messenger-network:
    driver: bridge
