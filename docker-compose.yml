version: '3.8'
# ORQUESTACIÓN DE SERVICIOS (Docker Compose)
# Define la infraestructura local necesaria para correr la aplicación completa.
#
# Comandos útiles:
# - Iniciar: docker-compose up --build
# - Detener: docker-compose down
# - Ver logs: docker-compose logs -f

services:
  # APP: Backend Spring Boot
  messenger-backend:
    build: .
    container_name: messenger-backend
    ports:
      - "8080:8080"
    # Cargar variables desde el archivo .env en el subdirectorio
    env_file:
      - ./messenger/.env
    environment:
      # Conectar a servicios definidos en este mismo archivo
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=messenger-db
      - DB_PORT=3306
      - REDIS_HOST=messenger-redis
      - REDIS_PORT=6379
      # Mapear credenciales dentro del contenedor
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json
    volumes:
      # Montar credenciales de Google Cloud desde el host (path en .env)
      - ${GOOGLE_APPLICATION_CREDENTIALS}:/app/credentials.json:ro
    depends_on:
      messenger-db:
        condition: service_healthy
      messenger-redis:
        condition: service_healthy
    networks:
      - messenger-network

  # DATABASE: MySQL 8.0
  messenger-db:
    image: mysql:8.0
    container_name: messenger-db
    env_file:
      - ./messenger/.env
    environment:
      # Usar la misma password definida en .env para el usuario root
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - messenger-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  # CACHE: Redis
  messenger-redis:
    image: redis:alpine
    container_name: messenger-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    env_file:
      - ./messenger/.env
    networks:
      - messenger-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# VOLÚMENES Y REDES
volumes:
  mysql_data:

networks:
  messenger-network:
    driver: bridge
